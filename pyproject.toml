[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opendot"
version = "0.4.2"
description = "An interactive terminal AI agent you can fully undo — any model, acts on your real files, every action reversible."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Vedaant Singh" }]
keywords = ["ai", "agent", "cli", "llm", "litellm", "coding-agent", "terminal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    # A newer litellm release (its context_management module) hard-imports
    # typing.NotRequired with no typing_extensions fallback, so it fails to import
    # on Python 3.10. Cap below that until it's fixed upstream / 3.10 is dropped.
    "litellm>=1.50,<1.95",  # any model: cloud, local, HF, through one interface
    "rich>=13.0",        # pretty terminal output (plain REPL fallback)
    "textual>=0.60",     # full-screen TUI (main pane + live ledger sidebar)
    "prompt_toolkit>=3.0",  # plain REPL input (history, editing)
    "mcp>=1.2",          # MCP client: connect to external MCP servers' tools
    "textual-image>=0.8",  # render the logo image on the welcome screen (TGP/Sixel/Unicode)
    "composio>=0.11,<0.12",  # /composio: 3000+ app tools (Gmail, Slack, GitHub, …)
    "pyscrappy>=1.3.2",  # web_fetch: fetch a URL as LLM-ready markdown
]

[project.optional-dependencies]
office = ["openpyxl>=3.1", "python-pptx>=0.6", "python-docx>=1.1"]  # xlsx / pptx / docx tools
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "openpyxl>=3.1", "python-pptx>=0.6", "python-docx>=1.1"]

[project.scripts]
opendot = "opendot.cli:main"

[project.urls]
Repository = "https://github.com/vedaant00/opendot"

[tool.hatch.build.targets.wheel]
packages = ["src/opendot"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# The formatter owns line width; E501 only fires on lines it can't split
# (long string literals, Rich markup, CSS), so enforcing it adds noise, not value.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"   # pytest-asyncio runs `async def test_*` without per-test markers
filterwarnings = [
    # Emitted inside textual-image (calls Pillow's deprecated Image.getdata),
    # not our code — filter so our own warnings stay visible.
    "ignore:Image.Image.getdata is deprecated:DeprecationWarning",
]
